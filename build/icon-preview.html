<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>阿一古数模 · 图标候选</title><style>
  body { margin:0; padding:24px; background:#0f172a; color:#e2e8f0;
         font:14px/1.5 "Microsoft YaHei",sans-serif; display:flex; gap:26px; flex-wrap:wrap; }
  figure { margin:0; text-align:center; }
  .dark {
    width:256px; height:256px; border-radius:58px;
    background:linear-gradient(150deg,#4468bd,#2b4179 52%,#1a2545);
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.22);
  }
  .dark svg { width:186px; height:186px; }
  .dark.sm { width:64px; height:64px; border-radius:14px; }
  .dark.sm svg { width:46px; height:46px; }
  .dark.tiny { width:32px; height:32px; border-radius:7px; }
  .dark.tiny svg { width:24px; height:24px; }
  figcaption { margin-top:8px; color:#94a3b8; font-size:12px; }
  .light { background:linear-gradient(150deg,#eef2ff,#dbe4ff); }
</style></head>
<body>
  <!-- 当前实现（side profile，朝左） -->
  <figure>
    <div class="dark" id="c1"></div>
    <figcaption>当前实现 · 256</figcaption>
  </figure>
  <figure>
    <div class="dark sm" id="c1s"></div>
    <figcaption>64px</figcaption>
  </figure>
  <figure>
    <div class="dark tiny" id="c1t"></div>
    <figcaption>32px</figcaption>
  </figure>
  <figure>
    <div class="dark light" id="c1l" style="background:linear-gradient(150deg,#eef2ff,#dbe4ff)"></div>
    <figcaption>浅底</figcaption>
  </figure>

  <script>
    // 与 src/main/icon.js 保持同一份路径（目检用，避免两处漂移看不出来）
    const HORSE_PATH = "M152 26 C146 36 142 46 138 56 C130 62 122 68 114 76 C98 88 78 104 58 118 C46 126 39 133 38 142 C37 152 45 160 57 164 C69 168 81 170 90 174 C94 182 93 192 92 200 L96 216 L170 216 C176 200 178 182 176 162 C172 136 166 110 160 92 C156 80 152 70 150 60 C152 48 152 36 152 26 Z";
    const MANE = ["M160 92 C166 112 170 136 172 158","M150 68 C156 84 160 102 162 120"];
    const svg = (fill) => `
      <svg viewBox="0 0 256 256">
        <path d="${HORSE_PATH}" fill="${fill}"/>
        <g fill="none" stroke="#2b4179" stroke-width="5" stroke-linecap="round" opacity=".55">
          ${MANE.map(d => `<path d="${d}"/>`).join('')}
        </g>
      </svg>`;
    document.getElementById('c1').innerHTML = svg('#ffffff');
    document.getElementById('c1s').innerHTML = svg('#ffffff');
    document.getElementById('c1t').innerHTML = svg('#ffffff');
    document.getElementById('c1l').innerHTML = svg('#2b4179');
  </script>
</body></html>
