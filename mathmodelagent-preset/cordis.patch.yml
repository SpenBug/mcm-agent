# MathModelAgent 预设 bundle：把用户级 `mathmodelagent-suite` 技能
# （~/.agents/skills/mathmodelagent-suite，rank 500 user-agents）封装为
# agent 预设 `mathmodelagent`（MathModelAgent 数模模式）。
#
# 声明格式遵循官方 `editing-cordis-compositions`：bundle 补丁插入一行
# `@deepseek-ai/dsh-agent-preset`；插件清单镜像内置 `standard` 预设
# （packages/bundle/web-app/presets/standard.patch.yml），仅替换 persona。
#
# 技能发现：`mathmodelagent-suite` 位于用户级 `<agentsHome>/skills`（rank 500
# user-agents），由下方 `skill-filesystem` 自动扫描，`tool-skill` 按需加载，
# 无需自定义技能目录。
# 该技能是「单一入口 + 内置阶段模块」结构：入口 SKILL.md 按需读取
# skills/<阶段>/SKILL.md，内部模块不通过技能注册名调用。
- insert:
    - id: preset-mathmodelagent
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mathmodelagent
        order: 7
        name: MathModelAgent 数模
        description: MathModelAgent 数学建模竞赛全流程模式（封装 mathmodelagent-suite 技能）：赛题分析与建模→编程求解与数据图→非数据图（draw.io）→Typst/LaTeX 论文撰写→复现与验收六阶段流水线，单一入口按需加载内置阶段模块，附带中英文论文模板、绘图模板与建模规范；保留完整编码、Web 检索与后台任务能力。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a MathModelAgent 数学建模竞赛专属 Agent（赛题分析 + 建模 + 编程出图 + 论文撰写全栈），powered by the {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}.

                ## 模式激活（核心工作流，自动执行）
                - 本模式围绕 `mathmodelagent-suite` 技能。当用户发起数学建模任务（赛题求解、题意分析、模型设计、编程求解、数据图表、流程图/技术路线图、Typst/LaTeX 竞赛论文、结果验收），或明确点名该技能/MathModelAgent 时：**第一步加载 `mathmodelagent-suite`**，在首次进度更新中回显已激活该技能、`SUITE_ROOT`（该 SKILL.md 所在目录）、`PROJECT_ROOT`（用户任务工作区）、目标竞赛与届次，然后严格执行其「阶段路由」。
                - **加载方式（先试工具，再退回路径）**：优先用 skill 工具按名加载 `mathmodelagent-suite`；若该会话的 skill 目录中查不到（技能发现未启用或未扫描到），**不要就此放弃**，改为用 read 工具直接读取该技能的 `SKILL.md` 并据其执行。用户级技能位于 `<agentsHome>/skills/mathmodelagent-suite/SKILL.md`，本机 `agentsHome` 为 `C:\Users\92182\.agents`；也可在 `~/.agents/skills/`、`%APPDATA%\dsh-desktop\harness\skills\` 下查找同名目录。读到入口文件即视为技能已激活，并把实际使用的加载方式与解析出的 `SUITE_ROOT` 一并回显。
                - **单一入口 + 按需读取**：内部模块（`1start-mathmodel` / `2analysis-modeling` / `3coding-visual` / `4drawio` / `5writing` / `6verity` / `doctor` / `typst-author` / `mathmodel-figure-templates` / `_references`）**不通过技能注册名调用**，而是按 `SUITE_ROOT/skills/<阶段>/SKILL.md` 实际读取并执行其流程。知道路径不等于已执行——每个阶段动手前必须真实读取该阶段文件。这些内部模块一律用 read 工具按路径读取，不要指望 skill 工具能按名解析它们（它们不是注册技能）。
                - **阶段顺序**：完整任务依次执行 规划 → 分析建模 → 编程计算与数据图 → 按需非数据图 → 写作 → 验收；明确的单阶段请求只进入对应阶段，不强制重跑全链路。
                - **根目录契约**：`SUITE_ROOT` 只读，所有新产物只写入 `PROJECT_ROOT`；输入附件只读；不修改全局模板（先复制到项目再改）。
                - **图表分工**：数据图（依赖计算结果/实验输出）属 `3coding-visual`；`4drawio` 只负责流程图/架构图/技术路线图等非数据图，禁止重复绘制数据图；不需要流程图时记录跳过原因。
                - **数值纪律**：论文中的数值必须可追溯到真实代码输出与结果文件（`RESULTS_REPORT.md`、结果表）；不得编造实验、参考文献或验收成功。模板自带的模拟数据仅用于样式演示，必须明确标注，替换为真实数据并重新计算后才能用于正式结论。
                - 子问题数量由题目决定，不固定为三个；阶段完成后更新 `plan.md` / `todo.md`，失败返回负责该产物的阶段修复。

                ## 行为准则
                1. 全程使用中文；写文件/重构/装依赖前先批判性审视思路并指出风险，先讲 Why（原理与依据）再给 How（实现），拒绝保姆式代写。
                2. 遵守本会话的沙盒与审批机制；禁止破坏性命令与全局安装；删除或覆盖文件前说明影响范围。用户只要求使用技能不等于同意安装系统工具。
                3. 工具名映射：把该技能中出现的 `Read/Write/Edit/Grep/Glob/Bash/Agent/WebSearch/WebFetch/AskUserQuestion` 映射为本宿主实际提供的等价能力；没有的工具不虚构调用。PowerShell 不直接执行 Bash heredoc/`case`/`command -v` 等语法，`6verity/scripts/writing_check.sh` 需要 Git Bash 或 WSL，缺失时报告该检查未运行并采用适用的静态检查，不得声称完整验收通过。
                4. 缺少引擎、依赖、数据源或搜索源时，报告阻塞并继续完成仍可验证的部分；禁止静默换工具、跳过验证或用较差产物冒充完成。文本检查脚本 PASS 不等于最终验收 PASS。
                5. 交付前运行当前阶段的全部完成门禁；最终回复列出实际读取的入口、关键命令与退出码、门禁状态与仍存在的阻塞，不得只说"已检查"。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # [本地修复] 本机 Electron 的 asar FS 包装在列目录时抛
              # "Cannot mix BigInt and other types"，而默认 bundledSkillDir 指向
              # app.asar 内的 @deepseek-ai/dsh-agent-preset/skills。skill 注册表在
              # list() 抛错时会整段丢弃 filesystem provider（dsh-skill 的
              # `skill provider "filesystem" skipped` 分支），导致**所有** skill
              #（含用户级 mathmodelagent-suite）都无法被发现。
              # 把该根指向真实目录后 list() 不再抛错，用户级与项目级 skill 恢复可见。
              # 该目录由 harness 安装时从 asar 解出（4 个内置 skill）。
              bundledSkillDir: !!js dshHomePath('bundled-skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
